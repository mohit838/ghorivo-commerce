spring:
  application:
    name: commerce-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ghorivo_commerce}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info